<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart ClassScan Pro - Secure Flow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --accent: #06b6d4;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; justify-content: center; align-items: center; }

        .app-container {
            width: 100%; max-width: 430px; height: 100vh; max-height: 900px;
            background: #020617; position: relative; display: flex; flex-direction: column; overflow: hidden;
        }

        #splash-screen {
            position: absolute; inset: 0; background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center;
        }

        .splash-title { font-size: 1.8rem; font-weight: 800; color: #ffffff; margin-bottom: 8px; }
        .splash-subtitle { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-bottom: 30px; }

        .start-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border: none;
            padding: 14px 32px; font-size: 1rem; font-weight: 700; border-radius: 50px; cursor: pointer;
        }

        .app-header { padding: 16px 20px; background: rgba(15, 23, 42, 0.9); display: flex; justify-content: space-between; align-items: center; }

        .view-panel { display: none; flex-direction: column; height: 100%; padding-bottom: 70px; overflow-y: auto; }
        .view-panel.active { display: flex; }

        #qr-reader { width: 100%; background: #000; border: none !important; }

        .camera-controls { padding: 20px; display: flex; flex-direction: column; gap: 12px; }

        .alert-box {
            padding: 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; display: none; font-weight: 600;
        }
        .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--success); color: var(--success); }
        .alert-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--danger); }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group input { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 10px; color: white; outline: none; }

        .action-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border: none;
            padding: 14px; font-size: 1rem; font-weight: 700; border-radius: 10px; cursor: pointer; text-align: center; margin-top: 5px;
            display: none; /* Hidden by default */
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.08); color: white; border: 1px solid rgba(255,255,255,0.15);
            padding: 10px; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .danger-btn { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); color: var(--danger); }

        .scanned-info { background: rgba(6, 182, 212, 0.1); border: 1px dashed var(--accent); padding: 10px; border-radius: 8px; font-size: 0.85rem; display: none; text-align: center; }

        .tab-bar {
            position: absolute; bottom: 0; width: 100%; height: 65px; background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.08);
        }
        .tab-btn { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.75rem; cursor: pointer; }
        .tab-btn.active { color: var(--accent); }

        .logs-container { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .log-card { background: var(--card-bg); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; margin-bottom: 8px;}
        
        .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="app-container">

    <div id="splash-screen">
        <h1 class="splash-title">ClassScan Pro</h1>
        <p class="splash-subtitle">SECURE ATTENDANCE SYSTEM</p>
        <button class="start-btn" onclick="startApp()">Start Scanner</button>
    </div>

    <div class="app-header">
        <div style="font-weight: 700;"><i class="fa-solid fa-qrcode" style="color: var(--accent);"></i> ClassScan</div>
        <div id="current-date-display" style="font-size: 0.8rem; color: var(--text-muted);">Today</div>
    </div>

    <div id="view-scan" class="view-panel active">
        <div id="qr-reader"></div>

        <div class="camera-controls">
            <div id="scan-alert" class="alert-box"></div>

            <div class="input-group">
                <label style="font-size: 0.8rem; color: var(--text-muted);">Student Name / Roll No</label>
                <input type="text" id="student-name" placeholder="Enter your name first" oninput="checkFormReady()">
            </div>

            <div id="scanned-info-box" class="scanned-info">
                <i class="fa-solid fa-check-circle" style="color: var(--success);"></i> QR Code Verified! Ab apna naam enter karein.
            </div>

            <!-- CONTINUE BUTTON (Sirf tab dikhega jab QR scan ho jaye AUR Naam likh diya jaye) -->
            <button id="continue-btn" class="action-btn" onclick="saveAttendance()">Continue / Save Attendance</button>
        </div>
    </div>

    <!-- DAILY LOGS VIEW -->
    <div id="view-daily" class="view-panel">
        <div class="logs-container">
            <h3 style="font-size: 1rem; margin-bottom: 10px;">Aaj Ka Record (Today)</h3>
            <div class="toolbar">
                <button class="secondary-btn" onclick="exportToCSV()" style="flex: 1;"><i class="fa-solid fa-download"></i> Export Excel</button>
                <button class="secondary-btn danger-btn" onclick="clearData()"><i class="fa-solid fa-trash"></i></button>
            </div>
            <div id="today-logs-list"></div>
        </div>
    </div>

    <!-- MONTHLY HISTORY VIEW -->
    <div id="view-monthly" class="view-panel">
        <div class="logs-container">
            <h3 style="font-size: 1rem; margin-bottom: 10px;">All Attendance History</h3>
            <div class="toolbar">
                <button class="secondary-btn" onclick="exportToCSV()" style="flex: 1;"><i class="fa-solid fa-download"></i> Export All Excel</button>
            </div>
            <div id="monthly-logs-list"></div>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('scan', this)"><i class="fa-solid fa-camera"></i><span>Scanner</span></button>
        <button class="tab-btn" onclick="switchTab('daily', this)"><i class="fa-solid fa-calendar-check"></i><span>Rojana Logs</span></button>
        <button class="tab-btn" onclick="switchTab('monthly', this)"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></button>
    </div>

</div>

<script>
    let db = JSON.parse(localStorage.getItem('class_scan_db')) || [];
    let html5QrCode = null;
    let isQrVerified = false;

    document.getElementById('current-date-display').innerText = new Date().toLocaleDateString();

    function startApp() {
        document.getElementById('splash-screen').style.display = 'none';
        initQRScanner();
    }

    function initQRScanner() {
        html5QrCode = new Html5Qrcode("qr-reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 220, height: 220 } }, 
            onScanSuccess
        ).catch(e => console.log(e));
    }

    function onScanSuccess(decodedText) {
        const alertBox = document.getElementById('scan-alert');
        const scannedTextClean = decodedText.trim().toUpperCase();

        if (scannedTextClean.includes("PRESENT")) {
            isQrVerified = true;
            
            alertBox.className = "alert-box alert-success";
            alertBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> QR Code Verified Successfully!`;
            alertBox.style.display = "block";

            document.getElementById('scanned-info-box').style.display = "block";
            checkFormReady(); // Check karega ki naam likha hai ya nahi

            setTimeout(() => {
                alertBox.style.display = "none";
            }, 3000);
        } else {
            alertBox.className = "alert-box alert-danger";
            alertBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> INVALID QR CODE!`;
            alertBox.style.display = "block";

            setTimeout(() => {
                alertBox.style.display = "none";
            }, 3000);
        }
    }

    // Ye function check karega ki QR verified hai AND Name field khali nahi hai
    function checkFormReady() {
        const studentName = document.getElementById('student-name').value.trim();
        const continueBtn = document.getElementById('continue-btn');

        if (isQrVerified && studentName.length > 0) {
            continueBtn.style.display = "block";
        } else {
            continueBtn.style.display = "none";
        }
    }

    function saveAttendance() {
        const studentName = document.getElementById('student-name').value.trim();
        const alertBox = document.getElementById('scan-alert');

        if (!isQrVerified) {
            alert("Pehle valid QR code scan karein!");
            return;
        }

        if (!studentName) {
            alert("Pehle apna Naam / Roll No enter karein!");
            return;
        }

        const todayStr = new Date().toISOString().split('T')[0];
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        db.push({
            id: Date.now(),
            name: studentName,
            topic: "Verified Scan",
            date: todayStr,
            time: timeStr
        });

        localStorage.setItem('class_scan_db', JSON.stringify(db));

        alertBox.className = "alert-box alert-success";
        alertBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> SUCCESS: ${studentName} Marked Present!`;
        alertBox.style.display = "block";

        // Reset everything for next student
        document.getElementById('student-name').value = '';
        document.getElementById('continue-btn').style.display = 'none';
        document.getElementById('scanned-info-box').style.display = 'none';
        isQrVerified = false;

        renderDailyLogs();

        setTimeout(() => {
            alertBox.style.display = "none";
        }, 3000);
    }

    // 🔒 PASSWORD PROTECTION FOR LOGS & HISTORY
    function switchTab(tabName, btnElement) {
        if (tabName === 'daily' || tabName === 'monthly') {
            let pwd = prompt("Teacher Password enter karein:");
            if (pwd !== "Qwerty@123") {
                alert("Galat Password! Access Denied.");
                return;
            }
        }

        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`view-${tabName}`).classList.add('active');
        btnElement.classList.add('active');

        if (tabName === 'daily') renderDailyLogs();
        if (tabName === 'monthly') renderMonthlyLogs();
    }

    // 📥 EXPORT ATTENDANCE TO EXCEL (CSV)
    function exportToCSV() {
        if (db.length === 0) {
            alert("Export karne ke liye koi data nahi hai!");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,Student Name,Date,Time,Status\n";
        db.forEach(row => {
            csvContent += `"${row.name}","${row.date}","${row.time}","PRESENT"\n`;
        });

        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Class_Attendance_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // 🗑️ CLEAR / RESET DATA
    function clearData() {
        if (confirm("Kya aap saari attendance records delete karna chahte hain?")) {
            db = [];
            localStorage.removeItem('class_scan_db');
            renderDailyLogs();
            alert("Saara record clear kar diya gaya hai.");
        }
    }

    function renderDailyLogs() {
        const todayStr = new Date().toISOString().split('T')[0];
        const todayRecords = db.filter(item => item.date === todayStr);
        const container = document.getElementById('today-logs-list');
        container.innerHTML = todayRecords.length === 0 ? '<p style="color:#888; text-align:center; padding:20px;">Aaj koi record nahi hai.</p>' : '';
        
        todayRecords.forEach(item => {
            container.innerHTML += `<div class="log-card"><div><strong>${item.name}</strong><br><small>${item.time}</small></div><span style="color:#10b981;font-size:0.8rem;font-weight:bold;">PRESENT</span></div>`;
        });
    }

    function renderMonthlyLogs() {
        const container = document.getElementById('monthly-logs-list');
        container.innerHTML = db.length === 0 ? '<p style="color:#888; text-align:center; padding:20px;">Koi record nahi hai.</p>' : '';
        db.forEach(item => {
            container.innerHTML += `<div class="log-card"><div><strong>${item.name}</strong><br><small>${item.date} • ${item.time}</small></div><span style="color:#10b981;font-size:0.8rem;font-weight:bold;">PRESENT</span></div>`;
        });
    }

    renderDailyLogs();
</script>
</body>
</html>
