<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart ClassScan Pro - Debug Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --accent: #06b6d4;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; justify-content: center; align-items: center; }

        .app-container {
            width: 100%; max-width: 430px; height: 100vh; max-height: 900px;
            background: #020617; position: relative; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        #splash-screen {
            position: absolute; inset: 0; background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center;
        }

        .splash-title { font-size: 1.8rem; font-weight: 800; color: #ffffff; margin-bottom: 8px; }
        .splash-subtitle { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-bottom: 30px; }

        .start-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border: none;
            padding: 14px 32px; font-size: 1rem; font-weight: 700; border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
        }

        .app-header { padding: 16px 20px; background: rgba(15, 23, 42, 0.9); display: flex; justify-content: space-between; align-items: center; z-index: 10; }

        .view-panel { display: none; flex-direction: column; height: calc(100% - 130px); padding-bottom: 20px; overflow-y: auto; }
        .view-panel.active { display: flex; }

        #qr-reader { width: 100%; background: #000; border: none !important; }
        #qr-reader video { width: 100% !important; object-fit: cover !important; }

        .camera-controls { padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #020617; flex-grow: 1; }

        .alert-box {
            padding: 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; display: none; font-weight: 600;
        }
        .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--success); color: var(--success); }
        .alert-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--danger); }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group input { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 10px; color: white; outline: none; }
        .input-group input:focus { border-color: var(--accent); }

        .tab-bar {
            position: absolute; bottom: 0; width: 100%; height: 65px; background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.08);
            z-index: 50;
        }
        .tab-btn { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.75rem; cursor: pointer; transition: color 0.2s; }
        .tab-btn.active { color: var(--accent); }

        .logs-container { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .log-card { background: var(--card-bg); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="app-container">

    <div id="splash-screen">
        <h1 class="splash-title">ClassScan Pro</h1>
        <p class="splash-subtitle">SMART QR VALIDATOR</p>
        <button class="start-btn" onclick="startApp()">Start Scanner</button>
    </div>

    <div class="app-header">
        <div style="font-weight: 700;"><i class="fa-solid fa-qrcode" style="color: var(--accent);"></i> ClassScan</div>
        <div id="current-date-display" style="font-size: 0.8rem; color: var(--text-muted);">Today</div>
    </div>

    <div id="view-scan" class="view-panel active">
        <div id="qr-reader"></div>

        <div class="camera-controls">
            <div id="scan-alert" class="alert-box"></div>

            <div class="input-group">
                <label style="font-size: 0.8rem; color: var(--text-muted);">Student Name / Roll No</label>
                <input type="text" id="student-name" placeholder="Enter student name">
            </div>
        </div>
    </div>

    <div id="view-daily" class="view-panel">
        <div class="logs-container">
            <h3 style="font-size: 1rem; margin-bottom: 4px;">Aaj Ka Record (Today)</h3>
            <div id="today-logs-list"></div>
        </div>
    </div>

    <div id="view-monthly" class="view-panel">
        <div class="logs-container">
            <h3 style="font-size: 1rem; margin-bottom: 4px;">All History</h3>
            <div id="monthly-logs-list"></div>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('scan', this)"><i class="fa-solid fa-camera"></i><span>Scanner</span></button>
        <button class="tab-btn" onclick="switchTab('daily', this)"><i class="fa-solid fa-calendar-check"></i><span>Rojana Logs</span></button>
        <button class="tab-btn" onclick="switchTab('monthly', this)"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></button>
    </div>

</div>

<script>
    let db = JSON.parse(localStorage.getItem('class_scan_db')) || [];
    let html5QrCode = null;
    let isCooldown = false;
    let scannerIsRunning = false;

    document.getElementById('current-date-display').innerText = new Date().toLocaleDateString();

    function startApp() {
        document.getElementById('splash-screen').style.display = 'none';
        initQRScanner();
    }

    function initQRScanner() {
        if (scannerIsRunning) return;
        
        html5QrCode = new Html5Qrcode("qr-reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 200, height: 200 } }, 
            onScanSuccess
        ).then(() => {
            scannerIsRunning = true;
        }).catch(err => {
            console.error("Camera Error:", err);
            const alertBox = document.getElementById('scan-alert');
            alertBox.className = "alert-box alert-danger";
            alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Camera Error: ${err}`;
            alertBox.style.display = "block";
        });
    }

    function stopQRScanner() {
        if (html5QrCode && scannerIsRunning) {
            html5QrCode.stop().then(() => {
                scannerIsRunning = false;
            }).catch(err => console.log("Failed to clear scanner. ", err));
        }
    }

    function onScanSuccess(decodedText) {
        if (isCooldown) return;
        isCooldown = true;

        const alertBox = document.getElementById('scan-alert');
        let studentName = document.getElementById('student-name').value.trim();
        if (!studentName) {
            studentName = "Guest Student";
        }
        
        const scannedTextClean = decodedText.trim().toUpperCase();

        if (scannedTextClean.includes("PRESENT")) {
            const todayStr = new Date().toISOString().split('T')[0];
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            db.push({
                id: Date.now(),
                name: studentName,
                topic: "Verified Scan",
                date: todayStr,
                time: timeStr
            });

            localStorage.setItem('class_scan_db', JSON.stringify(db));

            alertBox.className = "alert-box alert-success";
            alertBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> SUCCESS: ${studentName} Marked Present!`;
            alertBox.style.display = "block";

            renderDailyLogs();
            document.getElementById('student-name').value = '';
        } else {
            alertBox.className = "alert-box alert-danger";
            alertBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> INVALID QR!<br><small style="font-size:0.7rem;">Scanned: "${decodedText.substring(0, 30)}"</small>`;
            alertBox.style.display = "block";
        }

        setTimeout(() => {
            alertBox.style.display = "none";
            isCooldown = false;
        }, 3500);
    }

    function switchTab(tabName, btnElement) {
        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`view-${tabName}`).classList.add('active');
        btnElement.classList.add('active');

        if (tabName === 'scan') {
            if (!scannerIsRunning) initQRScanner();
        } else {
            stopQRScanner();
        }

        if (tabName === 'daily') renderDailyLogs();
        if (tabName === 'monthly') renderMonthlyLogs();
    }

    function renderDailyLogs() {
        const todayStr = new Date().toISOString().split('T')[0];
        const todayRecords = db.filter(item => item.date === todayStr);
        const container = document.getElementById('today-logs-list');
        
        if (todayRecords.length === 0) {
            container.innerHTML = '<p style="color:#888; font-size:0.85rem; margin-top:10px;">Aaj koi record nahi hai.</p>';
            return;
        }

        container.innerHTML = '';
        todayRecords.slice().reverse().forEach(item => {
            container.innerHTML += `<div class="log-card"><div><strong>${item.name}</strong><br><small style="color:var(--text-muted);">${item.time}</small></div><span style="color:#10b981;font-size:0.8rem;font-weight:bold;">PRESENT</span></div>`;
        });
    }

    function renderMonthlyLogs() {
        const container = document.getElementById('monthly-logs-list');
        
        if (db.length === 0) {
            container.innerHTML = '<p style="color:#888; font-size:0.85rem; margin-top:10px;">Koi record nahi hai.</p>';
            return;
        }

        container.innerHTML = '';
        db.slice().reverse().forEach(item => {
            container.innerHTML += `<div class="log-card"><div><strong>${item.name}</strong><br><small style="color:var(--text-muted);">${item.date} • ${item.time}</small></div><span style="color:#10b981;font-size:0.8rem;font-weight:bold;">PRESENT</span></div>`;
        });
    }

    renderDailyLogs();
</script>
</body>
</html>
